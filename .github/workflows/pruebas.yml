name: pruebas

# Lo que se verifica acá tiene que poder correr sin GPU, sin PyBullet y sin
# descargar 2 GB de PyTorch. El simulador completo se prueba a mano; esto
# atrapa lo que se rompe en silencio: sintaxis, enlaces y lanzadores.
#
# Los chequeos viven en tools/verificar.py y no como heredoc: `python - <<'PY'`
# es sintaxis de bash y el runner de Windows usa PowerShell.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sintaxis:
    name: Sintaxis Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compilar las tres carpetas
        run: |
          python -m compileall -q "Cerebro Wall-E"
          python -m compileall -q "Simulador Wall-E"
          python -m compileall -q "Asistente IA Wall-E"

  cerebro:
    name: Cerebro — enlace y protocolo
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # test_link.py es stdlib pura a propósito: el protocolo se puede probar
      # sin hardware y sin dependencias. --loopback levanta un puente falso.
      - name: Pruebas del enlace en loopback
        working-directory: "Cerebro Wall-E/cerebro"
        run: python test_link.py --loopback

      - name: El cliente UDP importa sin dependencias
        working-directory: "Cerebro Wall-E/cerebro"
        run: python -c "import walle_link; print('walle_link OK')"

  simulador:
    name: Simulador — entorno y modelo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: La observación del entorno V5 es de 58
        run: python tools/verificar.py obs

      - name: Las tres políticas están en el repo
        working-directory: "Simulador Wall-E"
        run: |
          for f in walle_ppo_model_v5_recovery.zip walle_ppo_model_v4_lidar.zip walle_ppo_model_v3_explorer.zip; do
            test -s "models/$f" || { echo "FALTA models/$f"; exit 1; }
            echo "OK models/$f ($(du -h "models/$f" | cut -f1))"
          done

      - name: La textura y la malla están en el repo
        working-directory: "Simulador Wall-E"
        run: |
          for f in material_0.png material.mtl walle_visual.obj; do
            test -s "$f" || { echo "FALTA $f"; exit 1; }
            echo "OK $f"
          done

  agente:
    name: Agente — cabina y cliente de Ollama
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # El cliente de Ollama es stdlib pura: se puede importar sin servidor.
      - name: El cliente de Ollama importa
        working-directory: "Asistente IA Wall-E/Modelo AI"
        run: python -c "from brain.llm import Ollama; print('Ollama OK')"

      - name: La personalidad existe y no está vacía
        run: python tools/verificar.py agente

      - name: El build servido de la cabina está en el repo
        working-directory: "Asistente IA Wall-E/Pagina Web/cockpit"
        run: python -c "import pathlib,sys; p=pathlib.Path('static/index.html'); sys.exit(0 if p.exists() and p.stat().st_size>0 else 'FALTA el build')"

  lanzadores:
    name: Lanzadores .bat sanos
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Un BOM o un acento en un .bat rompe cmd de formas raras de diagnosticar.
      - name: Verificar los .bat
        run: python tools/verificar.py bat

  documentacion:
    name: Cada carpeta se explica sola
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: README y 00-CONTEXTO en las tres
        run: python tools/verificar.py contexto

  carpeta-suelta:
    name: Cada carpeta se sostiene sola
    runs-on: ubuntu-latest
    strategy:
      matrix:
        carpeta:
          - "Cerebro Wall-E"
          - "Simulador Wall-E"
          - "Asistente IA Wall-E"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # La promesa del repo: cada carpeta se copia a un directorio vacío, sin
      # carpetas hermanas, y sigue funcionando.
      - name: Copiar solo esta carpeta
        run: |
          mkdir -p "$RUNNER_TEMP/solo"
          cp -r "${{ matrix.carpeta }}" "$RUNNER_TEMP/solo/proyecto"
          echo "SOLO=$RUNNER_TEMP/solo/proyecto" >> "$GITHUB_ENV"

      - name: Tiene su contexto y su README
        working-directory: ${{ env.SOLO }}
        run: |
          test -s README.md || { echo "FALTA README.md"; exit 1; }
          test -s 00-CONTEXTO.md || { echo "FALTA 00-CONTEXTO.md"; exit 1; }
          echo "documentacion OK"

      - name: Cerebro suelto
        if: matrix.carpeta == 'Cerebro Wall-E'
        working-directory: ${{ env.SOLO }}/cerebro
        run: python test_link.py --loopback

      - name: Simulador suelto
        if: matrix.carpeta == 'Simulador Wall-E'
        working-directory: ${{ env.SOLO }}
        run: |
          test -s requirements.txt
          test -s walle_env_v3.py
          test -s interactive_walle.py
          test -s "models/walle_ppo_model_v5_recovery.zip"
          python -m compileall -q .
          echo "simulador suelto OK"

      - name: Agente suelto
        if: matrix.carpeta == 'Asistente IA Wall-E'
        working-directory: ${{ env.SOLO }}/Modelo AI
        run: python -c "from brain.llm import Ollama; print('cabina OK')"
