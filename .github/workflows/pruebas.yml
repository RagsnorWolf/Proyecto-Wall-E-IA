name: pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suites:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Copias vendorizadas al dia
        run: python sincronizar.py --verificar

      - name: Compilar todo
        run: python -m compileall -q .

      - name: Cerebro (gradiente + entorno)
        working-directory: "Cerebro Wall-E (Actividad Fisica + PPO) .py"
        run: python -m unittest -v pruebas

      - name: Agente (cabina + API)
        working-directory: "Agente de IA Wall-E"
        run: python -m unittest -v pruebas_agente

      - name: Simulador headless
        working-directory: "Simulador Wall-E"
        run: python main.py --sin-ventana --escenario patio --pasos 200

      - name: Entrenamiento corto de humo
        working-directory: "Cerebro Wall-E (Actividad Fisica + PPO) .py"
        run: python entrenar_ppo.py --pasos 2048 --eval-episodios 1 --guardar modelo/humo.json --registro modelo/humo.csv

  carpeta-suelta:
    # La promesa del repo: cada carpeta se descarga SOLA y funciona.
    # Se copia cada una a un directorio vacio, sin carpetas hermanas.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        carpeta:
          - "Simulador Wall-E"
          - "Cerebro Wall-E (Actividad Fisica + PPO) .py"
          - "Agente de IA Wall-E"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Copiar solo esta carpeta
        run: |
          mkdir -p "$RUNNER_TEMP/solo"
          cp -r "${{ matrix.carpeta }}" "$RUNNER_TEMP/solo/proyecto"
          echo "SOLO=$RUNNER_TEMP/solo/proyecto" >> "$GITHUB_ENV"

      - name: Simulador suelto
        if: matrix.carpeta == 'Simulador Wall-E'
        working-directory: ${{ env.SOLO }}
        run: |
          python -m pip install --quiet pygame
          python main.py --sin-ventana --pasos 150

      - name: Cerebro suelto
        if: matrix.carpeta == 'Cerebro Wall-E (Actividad Fisica + PPO) .py'
        working-directory: ${{ env.SOLO }}
        run: |
          python -m unittest -v pruebas
          python entrenar_ppo.py --pasos 1024 --eval-episodios 1 --guardar modelo/humo.json --registro modelo/humo.csv

      - name: Agente suelto
        if: matrix.carpeta == 'Agente de IA Wall-E'
        working-directory: ${{ env.SOLO }}
        run: |
          python -m unittest -v pruebas_agente
          python -c "import server; print('cabina', server.VERSION)"
